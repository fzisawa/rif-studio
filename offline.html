<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>RIF Intranet</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#f8f7f4;--fg:#1d1c22;--mut:#6c6a75;--ac:#e8345a}@media(prefers-color-scheme:dark){:root{--bg:#17161b;--fg:#f2f1f5;--mut:#a3a1ad}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center}
img{width:72px;height:72px}h1{font-size:20px;margin:14px 0 4px}p{color:var(--mut);margin:0 0 20px}
button{border:0;border-radius:99px;padding:11px 24px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}</style></head>
<body><main><img src="build/icon.png" alt=""><h1>인터넷에 연결되지 않았어요</h1><p>연결이 돌아오면 자동으로 다시 열려요.</p><button id="r">다시 시도</button></main>
<script>const u=new URLSearchParams(location.search).get("u")||"https://rif-studio.com/intranet/";const go=()=>{location.href=u};document.getElementById("r").onclick=go;addEventListener("online",go);setInterval(()=>{if(navigator.onLine)fetch(u,{mode:"no-cors",cache:"no-store"}).then(go).catch(()=>{})},10000)</script></body></html>
