<style>
main.wide{max-width:1400px}
.tabs{display:flex;gap:8px;margin:0 0 20px}.tabs button{padding:10px 20px;border-radius:99px;border:1px solid #7775;background:none;color:var(--mut);font:inherit;cursor:pointer}.tabs button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#tw{overflow-x:auto;margin-top:16px;border:1px solid #7773;border-radius:12px}
table.jt{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.jt th{position:sticky;top:0;background:var(--bg);text-align:left;padding:10px 12px;border-bottom:2px solid #7775;white-space:nowrap;font-size:12px;letter-spacing:.06em;color:var(--mut)}
.jt td{padding:10px 12px;border-bottom:1px solid #7773;vertical-align:top}
.jt tr.r{cursor:pointer}.jt tr.r:hover td{background:#7771}
.jt td.no{color:var(--mut);text-align:right;width:44px}.jt td.dt{white-space:nowrap}
.jt td.ch{max-width:240px}.jt td.ln{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jt tr.d td{background:#7771;padding:16px 20px}.jt tr.d p{white-space:pre-wrap;margin:0 0 12px}.jt tr.d b{color:var(--ac);font-size:12px;letter-spacing:.1em}
.jbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}.jbar .btn{padding:8px 18px;font-size:14px}.jbar input{padding:8px 14px;min-width:200px}
.btn.small{padding:6px 14px;font-size:13px;background:#7776}
.jt tr.dup td{background:#ff2d2d22}.jt tr.dup:hover td{background:#ff2d2d33}
.dupb{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:#e5332a;color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.jt td.mk{text-align:center;width:48px}.jt td.mk input{width:18px;height:18px;padding:0;accent-color:var(--ac);cursor:pointer}
.jt td.mm{min-width:180px}.jt input.memo{width:100%;padding:6px 10px;border-radius:8px;font-size:13px}
.jt td.ok,.jt input.memo.ok{outline:2px solid #3bb273;outline-offset:-2px}
#mf[hidden]{display:none!important}
#tw{overflow:visible;border:0}
table.jt{font-size:13px;table-layout:auto}
.jt th{padding:8px 6px;font-size:11px;letter-spacing:0;white-space:normal}
.jt td{padding:8px 6px;overflow-wrap:anywhere;word-break:normal}
.jt td.no{width:28px}.jt td.dt{white-space:normal;min-width:70px}
.jt td.ch{max-width:none}.jt td.ln{max-width:90px;white-space:normal;overflow-wrap:anywhere;overflow:visible}
.jt td.mk{width:34px;padding:8px 2px}.jt td.mm{min-width:120px}
main.wide{max-width:1500px;padding-left:2vw;padding-right:2vw}
</style></head><body>
