name: android
# RIF 인트라넷 안드로이드 앱 빌드 — 사이트(main)와 분리된 android-app 가지에서만 돌아요.
# 결과물(서명 전 APK · 기록)은 android-app-out 가지에 올라가요. 서명 열쇠는 여기 두지 않아요.
on:
  push:
    branches: [android-app]
permissions:
  contents: write
concurrency:
  group: android-app
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set +e
          mkdir -p out
          export JAVA_HOME="$JAVA_HOME_17_X64"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ./gradlew --no-daemon --stacktrace assembleRelease > out/gradle.log 2>&1
          echo "gradle exit=$?" >> out/gradle.log
          tail -40 out/gradle.log
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ls -la app/build/outputs/apk/release/ >> out/gradle.log 2>&1
          if [ -f "$APK" ]; then
            cp "$APK" out/rif-intranet-unsigned.apk
            "$BT/zipalign" -c -v 4 out/rif-intranet-unsigned.apk > out/zipalign.txt 2>&1; echo "zipalign exit=$?" >> out/zipalign.txt
            "$BT/aapt2" dump badging out/rif-intranet-unsigned.apk > out/badging.txt 2>&1
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml out/rif-intranet-unsigned.apk > out/manifest.txt 2>&1
            unzip -l out/rif-intranet-unsigned.apk > out/files.txt
            sha256sum out/rif-intranet-unsigned.apk > out/sha256.txt
          fi
          if [ -f signed/rif-intranet.apk ]; then
            "$BT/apksigner" verify --verbose --print-certs signed/rif-intranet.apk > out/verify.txt 2>&1; echo "apksigner exit=$?" >> out/verify.txt
            "$BT/zipalign" -c -v 4 signed/rif-intranet.apk > out/zipalign-signed.txt 2>&1; echo "zipalign exit=$?" >> out/zipalign-signed.txt
          fi
          exit 0
      - name: publish
        if: always()
        run: |
          git config user.name "rif-app-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan android-app-out
          git rm -rf --cached . >/dev/null
          git add -f out
          git commit -q -m "build output for ${GITHUB_SHA::7}"
          git push -f origin android-app-out

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: has signed apk
        id: has
        run: |
          if [ -f signed/rif-intranet.apk ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - name: enable kvm
        if: steps.has.outputs.yes == '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install and run on emulator
        if: steps.has.outputs.yes == '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./ci/device-test.sh
      - name: publish
        if: always() && steps.has.outputs.yes == '1'
        run: |
          mkdir -p out
          git config user.name "rif-app-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan android-app-test
          git rm -rf --cached . >/dev/null
          git add -f out
          git commit -q -m "device test for ${GITHUB_SHA::7}" || true
          git push -f origin android-app-test
