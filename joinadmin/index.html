<style>
main.wide{max-width:1400px}
#tw{overflow-x:auto;margin-top:16px;border:1px solid #7773;border-radius:12px}

.jt th{position:sticky;top:0;background:var(--bg);text-align:left;padding:10px 12px;border-bottom:2px solid #7775;white-space:nowrap;font-size:12px;letter-spacing:.06em;color:var(--mut)}
.jt td{padding:10px 12px;border-bottom:1px solid #7773;vertical-align:top}
.jt tr.r{cursor:pointer}.jt tr.r:hover td{background:#7771}
.jt td.no{color:var(--mut);text-align:right;width:44px}.jt td.dt{white-space:nowrap}
.jt td.ch{max-width:240px}.jt td.ln{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jt tr.d td{background:#7771;padding:16px 20px}.jt tr.d p{white-space:pre-wrap;margin:0 0 12px}.jt tr.d b{color:var(--ac);font-size:12px;letter-spacing:.1em}
.jbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}.jbar .btn{padding:8px 18px;font-size:14px}.jbar input{padding:8px 14px;min-width:200px}
.btn.small{padding:6px 14px;font-size:13px;background:#7776}
